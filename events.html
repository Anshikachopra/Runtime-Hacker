<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runtime Hacker Events</title>
  <style>
    :root { --bg:#070b13; --surface:#111827; --surface2:#0f172a; --text:#e2e8f0; --muted:#94a3b8; --accent:#7c3aed; }
    *{box-sizing:border-box;}
    body{margin:0;background:radial-gradient(circle at 20% 0%, #1f2937 0%, #070b13 45%, #020617 100%);color:white;font-family:Inter,system-ui,sans-serif;}
    header{position:sticky;top:0;z-index:20;background:rgba(9,14,26,0.95);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,0.06);}
    .nav{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:0.7rem 1rem;gap:0.8rem;}
    .logo{display:flex;align-items:center;gap:0.35rem;font-weight:700;font-size:1rem;color:#f8fafc;text-decoration:none;}
    .logo .box{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,#7c3aed,#22c55e);display:inline-flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:800;}
    .nav-links{display:flex;gap:0.55rem;flex-wrap:wrap;}
    .nav-links a{color:#e2e8f0;text-decoration:none;padding:0.25rem 0.5rem;border-radius:8px;transition:0.2s;}
    .nav-links a:hover{background:rgba(255,255,255,0.08);} .nav-links a.active{background:rgba(255,255,255,0.15);color:#fff;}
    .main{max-width:1100px;margin:1rem auto;padding:0 1rem;}
    .hero{background:var(--surface2);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:1rem;}
    .hero h1{margin:0 0 0.3rem;}
    .hero p{margin:0;color:#cbd5e1;}
    .events-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0.8rem;margin-top:1rem;}
    .event-card{background:var(--surface);border:1px solid rgba(255,255,255,0.08);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;}
    .event-card:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(0,0,0,.35);}
    .event-card img{width:100%;height:160px;object-fit:cover;display:block;}
    .event-body{padding:0.8rem;}
    .event-body h3{margin:0;font-size:1rem;}
    .event-body p{margin:0.35rem 0 0;font-size:.9rem;color:#cbd5e1;}
    .details{margin-top:1rem;background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:0.9rem;display:none;}
    .details.show{display:block;}
    .details h4{margin:0 0 0.3rem;}
    .details p{margin:0.2rem 0;color:#cbd5e1;line-height:1.45;}
    .back{margin-top:0.5rem;display:inline-block;color:#cbd5e1;text-decoration:none;font-size:.9rem;border:1px solid rgba(255,255,255,.2);padding:.25rem .45rem;border-radius:8px;}
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <a class="logo" href="index.html"><img src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=80&q=80" alt="Runtime Hacker" style="width:24px;height:24px;border-radius:6px;object-fit:cover;margin-right:0.35rem;">Runtime Hacker</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="achievements.html">Achievements</a>
        <a class="active" href="events.html">Events</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </header>
  <main class="main">
    <section class="hero">
      <h1>Upcoming Events</h1>
      <p>Click any event card to view the name, date, and full description.</p>
    </section>
    <section class="events-grid" id="eventsGrid"></section>
    <section class="details" id="eventDetails"><h4 id="detailsTitle"></h4><p id="detailsDate"></p><p id="detailsDesc"></p></section>
  </main>
  <script>
    const events = [
      { id:1, title:'Code Sprint Night', date:'April 2, 2026', desc:'Solve algorithm puzzles and build mini projects together in 2-hour sessions.', img:'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1200&q=80' },
      { id:2, title:'UI/UX Jam', date:'April 9, 2026', desc:'Design and prototype an app interface with live feedback from mentors.', img:'https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=1200&q=80' },
      { id:3, title:'Open-source Sprint', date:'April 16, 2026', desc:'Contribute to open-source projects and learn git workflows in a hands-on lab.', img:'https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=1200&q=80' }
    ];
    const grid = document.getElementById('eventsGrid');
    const details = document.getElementById('eventDetails');
    const detailsTitle = document.getElementById('detailsTitle');
    const detailsDate = document.getElementById('detailsDate');
    const detailsDesc = document.getElementById('detailsDesc');
    events.forEach(event => {
      const card = document.createElement('article');
      card.className='event-card';
      card.innerHTML = `<img src="${event.img}" alt="${event.title}" /><div class="event-body"><h3>${event.title}</h3><p>${event.date}</p></div>`;
      card.addEventListener('click', () => {
        detailsTitle.textContent=event.title;
        detailsDate.textContent='Date: ' + event.date;
        detailsDesc.textContent=event.desc;
        details.classList.add('show');
        details.scrollIntoView({behavior:'smooth', block:'start'});
      });
      grid.appendChild(card);
    });
  </script>
</body>
</html>
